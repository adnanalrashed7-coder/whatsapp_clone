<!-- منطقة الإدخال المثبتة -->
<div class="input-area">
    <div class="input-container">
        <div class="input-actions">
            <input type="file" id="image-input" accept="image/*" style="display: none;">
            <button type="button" class="action-btn image-btn" onclick="document.getElementById('image-input').click()" title="إرسال صورة" aria-label="إرسال صورة">
                <span class="icon-text" aria-hidden="true">🖼️</span>
            </button>
            <input type="file" id="file-input" style="display: none;">
            <button type="button" class="action-btn file-btn" onclick="document.getElementById('file-input').click()" title="إرسال ملف" aria-label="إرسال ملف">
                <span class="icon-text" aria-hidden="true">📎</span>
            </button>
            <button type="button" class="action-btn emoji-btn" title="إيموجي" aria-label="فتح منتقي الإيموجي">
                <span class="icon-text" aria-hidden="true">😊</span>
            </button>
        </div>
        
        <div class="message-input-container">
            <textarea 
                id="message-input" 
                class="message-input" 
                placeholder="اكتب رسالتك هنا..."
                rows="1"
                oninput="handleInputChange(this)"
            ></textarea>
        </div>
        
        <button type="button" id="send-button" class="send-button" onclick="sendMessage()" title="إرسال رسالة" aria-label="إرسال رسالة">
            <span class="icon-text" aria-hidden="true">✈️</span>
        </button>
    </div>
</div>

{% include 'chat/rooms/components/emoji_picker.html' %}
